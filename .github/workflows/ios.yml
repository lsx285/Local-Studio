name: iOS · unsigned IPA

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Swift 6 · iOS 27.2
    runs-on: xcode-27
    timeout-minutes: 15
    permissions:
      contents: read
      actions: write
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build unsigned IPA
        run: |
          set -euo pipefail
          # Only compiler errors are printed; everything else xcodebuild writes is dropped.
          xcodebuild -quiet -project LocalStudio.xcodeproj -scheme LocalStudio \
            -configuration Release -sdk iphoneos27.2 -destination 'generic/platform=iOS' \
            -derivedDataPath build/device CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO build 2>&1 \
            | { grep -E "error:" | sed -E -e 's|^([^:]+):([0-9]+):([0-9]+): error: (.*)$|::error file=\1,line=\2,col=\3::\4|' -e t -e 's|^.*error: (.*)$|::error::\1|' || true; }
          mkdir -p build/Payload
          ditto build/device/Build/Products/Release-iphoneos/LocalStudio.app build/Payload/LocalStudio.app
          ditto -c -k --keepParent build/Payload build/LocalStudio.ipa
      - name: Upload IPA
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: build/LocalStudio.ipa
          archive: false
          if-no-files-found: error
          retention-days: 14
      - name: Delete previous runs
        if: success() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for run_id in $(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs?per_page=100" \
              --jq ".workflow_runs[] | select(.id < $GITHUB_RUN_ID) | .id"); do
            gh api --silent --method DELETE "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" 2>/dev/null \
              || echo "::error::Could not delete previous run $run_id"
          done
